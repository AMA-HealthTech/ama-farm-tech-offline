<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AMA FarmTech Offline</title>
  <meta name="description" content="Offline farm records for Ama Farms Ltd. Works without internet and keeps your records on your phone.">
  <meta name="theme-color" content="#1e5c37">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AMA FarmTech">
  <!-- Only files from this same site may load or connect. No outside scripts, fonts or services. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="app-header">
    <div class="brand">
      <img class="brand-mark" src="icons/icon.svg" alt="" width="36" height="36">
      <div class="brand-text">
        <div class="brand-name">AMA FarmTech Offline</div>
        <div class="brand-sub">Ama Farms Ltd <span id="app-version" class="brand-version"></span></div>
      </div>
    </div>
    <div id="conn" class="conn conn-online" role="status" aria-label="Connection">
      <span class="conn-dot" aria-hidden="true"></span><span id="conn-text">Online</span>
    </div>
  </header>

  <div id="banners" class="banners"></div>

  <main id="main" tabindex="-1">
    <div class="loading" role="status">Loading your farm records&hellip;</div>
    <noscript><p class="noscript">AMA FarmTech Offline needs JavaScript. Please turn it on in Chrome and reload.</p></noscript>
  </main>

  <nav class="bottom-nav" aria-label="Main">
    <a href="#/" data-nav="dashboard">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 11.5 12 4l9 7.5M5.5 10v9.5h13V10M10 19.5v-5h4v5"/></svg>
      <span>Home</span>
    </a>
    <a href="#/farm" data-nav="farm">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 21v-8M12 13c0-4 2.5-6.5 7-6.5 0 4.5-2.5 6.5-7 6.5zM12 15c0-3-2-5-6-5 0 3.5 2 5 6 5z"/></svg>
      <span>My Farm</span>
    </a>
    <a href="#/crops" data-nav="crops">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 21V8M12 8c-2-.5-3.5-2-3.5-4 2 .5 3.5 2 3.5 4zM12 8c2-.5 3.5-2 3.5-4-2 .5-3.5 2-3.5 4zM12 13c-2-.5-3.5-2-3.5-4M12 13c2-.5 3.5-2 3.5-4M12 18c-2-.5-3.5-2-3.5-4M12 18c2-.5 3.5-2 3.5-4"/></svg>
      <span>Crops</span>
    </a>
    <a href="#/records" data-nav="records">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
      <span>Records</span>
    </a>
    <a href="#/backup" data-nav="backup">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16v4H4zM5.5 11v8h13v-8M10 15h4"/></svg>
      <span>Backup</span>
    </a>
    <a href="#/settings" data-nav="settings">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6"/></svg>
      <span>Settings</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="db.js"></script>
  <script src="crops.js"></script>
  <script src="backup.js"></script>
  <script src="app.js"></script>
  <script src="crops-ui.js"></script>
</body>
</html>
